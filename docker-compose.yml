# ============================================================
#  DOCKER COMPOSE — PRODUKSI
#
#     web  : https://lets-digital.bbpompky.id   -> container :3007
#     API  : https://data-lets.bbpompky.id/api  -> container :5006
#
#  Kedua domain itu diteruskan oleh reverse proxy (nginx/tunnel) di
#  server ke 127.0.0.1:3007 dan 127.0.0.1:5006.
#
#  KREDENSIAL TIDAK DITULIS DI FILE INI. Semua dibaca dari .env
#  (tidak di-commit). Di server cukup:
#       cp .env.example .env
#       nano .env          # isi nilai rahasia
#
#  Menjalankan:
#     docker compose up -d --build
#     docker compose ps
#     docker compose logs -f
# ============================================================

name: jendela-kinerja

# Pembatas ukuran log supaya disk server tidak penuh (bawaan Docker
# tanpa batas). Berlaku untuk semua layanan di bawah.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================================
  #  BACKEND (Express + MySQL)
  #
  #  network_mode: "host"  ==> container memakai network stack
  #  server langsung. Akibatnya:
  #    1. Port 5006 otomatis terbuka di server (TANPA "ports:"),
  #       sehingga reverse proxy di LAN bisa mengaksesnya.
  #    2. DB_HOST=127.0.0.1 di sini menunjuk ke SERVER (bukan
  #       container), jadi MySQL di luar Docker tetap kena
  #       TANPA perlu ubah bind-address / grant user '@%'.
  #  Syarat: host Docker harus Linux.
  # ==========================================================
  backend:
    build:
      context: ./backend
    image: jendela-kinerja/backend:latest
    container_name: jendela-backend
    restart: unless-stopped
    init: true
    network_mode: "host"
    environment:
      # ---------- Server ----------
      NODE_ENV: production
      PORT: ${BACKEND_PORT}
      # Isi BACKEND_HOST di .env. 127.0.0.1 = hanya server ini (paling aman
      # bila memakai reverse proxy lokal). Untuk mode bridge wajib 0.0.0.0.
      HOST: ${BACKEND_HOST}

      # ---------- Database (MySQL di server ini, di luar Docker) ----------
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi - salin .env.example ke .env}
      DB_NAME: ${DB_NAME}

      # ---------- Keycloak ----------
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET wajib diisi - salin .env.example ke .env}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD wajib diisi - salin .env.example ke .env}

      # ---------- CORS & tautan publik ----------
      # Browser hanya boleh memanggil API dari domain web ini.
      CORS_ORIGIN: ${WEB_URL:?WEB_URL wajib diisi - salin .env.example ke .env}
      # Dipakai backend saat membuat tautan API yang dibagikan.
      PUBLIC_BASE_URL: ${API_URL:?API_URL wajib diisi - salin .env.example ke .env}

      # ---------- Rahasia aplikasi ----------
      # Dipakai menyegel token di tabel api_link (AES-256-GCM).
      # API_LINK_SECRET opsional; bila kosong dipakai SESSION_SECRET.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi - salin .env.example ke .env}
      API_LINK_SECRET: ${API_LINK_SECRET}

      # ---------- Keamanan token ----------
      AUTH_VERIFIKASI: ${AUTH_VERIFIKASI}
      AUTH_PERIKSA_ISSUER: ${AUTH_PERIKSA_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      PERAN_TULIS: ${PERAN_TULIS}
    volumes:
      # Volume data opsional (aplikasi hanya memakai database; folder ini
      # disediakan bila nanti ada berkas yang perlu disimpan ke disk).
      - ./data/backend:/data
    healthcheck:
      # network_mode: host -> 127.0.0.1 di sini = server
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${BACKEND_PORT}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    security_opt:
      - no-new-privileges:true

  # ==========================================================
  #  FRONTEND (Next.js)  ->  https://lets-digital.bbpompky.id
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* dipakai BROWSER, jadi harus alamat PUBLIK
        # (bukan localhost / IP LAN). Nilai ini ditanam saat build ->
        # kalau berubah, frontend harus di-build ulang (--no-cache).
        NEXT_PUBLIC_API_URL: ${API_URL:?API_URL wajib diisi - salin .env.example ke .env}
        NEXT_PUBLIC_LAURA_URL: ${LAURA_URL}
    image: jendela-kinerja/frontend:latest
    container_name: jendela-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT}:3007"
    environment:
      NODE_ENV: production
      PORT: "3007"
      HOSTNAME: 0.0.0.0
      # Alamat API untuk browser (harus URL publik)
      NEXT_PUBLIC_API_URL: ${API_URL:?API_URL wajib diisi - salin .env.example ke .env}
      NEXT_PUBLIC_LAURA_URL: ${LAURA_URL}
      # Alamat backend yang dipanggil PROXY di pages/api/** (server-side).
      # Kosong = memakai NEXT_PUBLIC_API_URL (alamat publik). Isi alamat
      # internal bila domain API publik belum/tidak dirutekan, mis.
      # http://host.docker.internal:5006/api (lihat extra_hosts di bawah).
      BACKEND_API_URL: ${BACKEND_API_URL}

      # ---------- Keycloak (sisi server / NextAuth) ----------
      KEYCLOAK_ISSUER: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET wajib diisi - salin .env.example ke .env}

      # ---------- NextAuth ----------
      # NEXTAUTH_URL HARUS sama dengan alamat yang dibuka di browser
      NEXTAUTH_URL: ${WEB_URL:?WEB_URL wajib diisi - salin .env.example ke .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET wajib diisi - salin .env.example ke .env}
      # Awalan nama cookie sesi (hindari bentrok dengan aplikasi lain
      # di domain yang sama)
      AUTH_COOKIE_PREFIX: ${AUTH_COOKIE_PREFIX}

      # ---------- Integrasi LAURA (opsional) ----------
      LAURA_API_URL: ${LAURA_API_URL}
    volumes:
      - ./data/frontend:/data
    extra_hosts:
      # Backend memakai network_mode: "host", jadi host.docker.internal
      # menunjuk server (dipakai bila BACKEND_API_URL diisi alamat internal).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3007/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    security_opt:
      - no-new-privileges:true
