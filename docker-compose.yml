# ============================================================
#  DOCKER COMPOSE — PRODUKSI
#
#     web  : https://jendela-kinerja.bbpompky.id -> container :3007
#     API internal: backend :5006 (host network)
#
#  Semua nilai dibaca dari .env (tidak di-commit). Nama variabel di file ini
#  SAMA PERSIS dengan .env server:
#     PORT_BACKEND, PORT_FRONTEND, CORS_ORIGIN, DB_*, KEYCLOAK_*,
#     KEYCLOAK_ISSUER, NEXT_PUBLIC_API_URL, NEXTAUTH_URL, NEXTAUTH_SECRET,
#     laura_API_URL, CHROME_PATH
#
#  Menjalankan:
#     docker compose up -d --build
#     docker compose ps
#     docker compose logs -f
# ============================================================

name: jendela-kinerja

# Pembatas ukuran log supaya disk server tidak penuh (bawaan Docker
# tanpa batas). Berlaku untuk semua layanan di bawah.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================================
  #  BACKEND (Express + MySQL)
  #
  #  network_mode: "host"  ==> container memakai network stack
  #  server langsung. Akibatnya:
  #    1. Port PORT_BACKEND otomatis terbuka di server (TANPA "ports:").
  #    2. DB_HOST=127.0.0.1 di sini menunjuk ke SERVER (bukan
  #       container), jadi MySQL di luar Docker tetap kena
  #       TANPA perlu ubah bind-address / grant user '@%'.
  #  Syarat: host Docker harus Linux.
  # ==========================================================
  backend:
    build:
      context: ./backend
    image: jendela-kinerja/backend:latest
    container_name: jendela-backend
    restart: unless-stopped
    init: true
    network_mode: "host"
    environment:
      # ---------- Server ----------
      NODE_ENV: production
      PORT: ${PORT_BACKEND}
      # 0.0.0.0 supaya container frontend (jaringan bridge) bisa memanggil
      # backend lewat http://host.docker.internal:PORT/api. Bila ingin
      # backend tetap hanya di loopback (127.0.0.1), jalankan juga frontend
      # dengan network_mode: "host" dan set BACKEND_API_URL=127.0.0.1.
      HOST: 0.0.0.0

      # ---------- Database (MySQL di server ini, di luar Docker) ----------
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      # ---------- Keycloak ----------
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # ---------- CORS & tautan publik ----------
      # Daftar origin yang boleh memanggil API dari browser (dari .env).
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Dipakai backend saat membuat tautan API yang dibagikan.
      PUBLIC_BASE_URL: ${NEXT_PUBLIC_API_URL}

      # ---------- Rahasia aplikasi ----------
      # Penyegel token di tabel api_link (AES-256-GCM). .env tidak memuat
      # SESSION_SECRET, jadi dipakai NEXTAUTH_SECRET. Menggantinya membuat
      # link lama tidak bisa dibuka lagi.
      SESSION_SECRET: ${NEXTAUTH_SECRET}

      # ---------- Keamanan token ----------
      AUTH_VERIFIKASI: aktif
      AUTH_PERIKSA_ISSUER: aktif
      PERAN_TULIS: admin,superadmin,admin_*

      # ---------- Cetak PDF (Chrome headless di server) ----------
      CHROME_PATH: ${CHROME_PATH}
    volumes:
      # Volume data opsional (aplikasi hanya memakai database; folder ini
      # disediakan bila nanti ada berkas yang perlu disimpan ke disk).
      - ./data/backend:/data
    healthcheck:
      # network_mode: host -> 127.0.0.1 di sini = server
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT_BACKEND}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    security_opt:
      - no-new-privileges:true

  # ==========================================================
  #  FRONTEND (Next.js)  ->  https://jendela-kinerja.bbpompky.id
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* dipakai BROWSER, jadi harus alamat PUBLIK
        # (bukan localhost / IP LAN). Nilai ini ditanam saat build ->
        # kalau berubah, frontend harus di-build ulang (--no-cache).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: jendela-kinerja/frontend:latest
    container_name: jendela-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${PORT_FRONTEND}:3007"
    extra_hosts:
      # Backend memakai network_mode: "host" -> dibutuhkan agar
      # host.docker.internal menunjuk server (bukan container ini).
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "3007"
      HOSTNAME: 0.0.0.0
      # Alamat API untuk browser (harus URL publik)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Alamat backend yang dipanggil PROXY di pages/api/** (server-side).
      # Ditunjuk ke jalur internal supaya tidak bergantung pada domain API
      # publik (yang bisa belum dirutekan / memutar balik lewat Cloudflare).
      BACKEND_API_URL: http://host.docker.internal:${PORT_BACKEND}/api

      # ---------- Keycloak (sisi server / NextAuth) ----------
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}

      # ---------- NextAuth ----------
      # NEXTAUTH_URL HARUS sama dengan alamat yang dibuka di browser
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Awalan nama cookie sesi (hindari bentrok dengan aplikasi lain
      # di domain yang sama)
      AUTH_COOKIE_PREFIX: jk

      # ---------- Integrasi LAURA (opsional) ----------
      LAURA_API_URL: ${laura_API_URL}
    volumes:
      - ./data/frontend:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3007/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    security_opt:
      - no-new-privileges:true